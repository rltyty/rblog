baseURL: https://korhal.h4ck.me
theme: LoveIt
title: rblog
languageCode: en
languageName: English
hasCJKLanguage: false
copyright: "© [rblog contributors](https://github.com/rltyty/rblog/graphs/contributors)"
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
ignoreErrors:
  - error-remote-getjson
  - error-missing-instagram-accesstoken
pagination:
  disableAliases: false
  pagerSize: 10
  path: page
menu:
  main:
    - weight: 1
      identifier: notes
      pre: "<i class='fa-solid fa-book'></i>"
      post: ""
      name: Notes
      url: /notes/
      title: ""
    - weight: 2
      identifier: tags
      pre: ""
      post: "<i class='fa-solid fa-tag'></i>"
      name: Tags
      url: /tags/
      title: ""
    - weight: 3
      identifier: categories
      pre: "<i class='fa-solid fa-list'></i>"
      post: ""
      name: Categories
      url: /categories/
      title: ""
    - weight: 4
      identifier: toolbox
      pre: "<i class='fa-solid fa-wrench'></i>"
      post: ""
      name: "rTools"
      url: /toolbox/
      title: "rTools"
    - weight: 6
      identifier:: "github"
      pre: "<i class='fab fa-github fa-fw' aria-hidden='true'></i>"
      post: ""
      name: ""
      url: "https://github.com/rltyty/rblog"
      title: "GitHub"

params:
  defaultTheme: auto
  gitRepo: "https://github.com/rltyty/rblog"
  fingerprint: "sha512"
  dateFormat: "2025-03-02"
  title: 👋 Welcome to rblog!
  description: rblog and my knowledge base
  images:
    - /logo.png
  author:
    name: RLTYTY
    email: ""
    link: "https://github.com/rltyty"
  header:
    desktopMode: fixed
    mobileMode: auto
    title:
      logo: ""
      name: "rblog"
      # pre: "<i class='far fa-kiss-wink-heart fa-fw' aria-hidden='true'></i>"
      pre: "<i class='fa-solid fa-cat'></i>"
      post: ""
      typeit: false
  footer:
    enable: true
    custom: ""
    hugo: false
    copyright: true
    author: true
    since: 2024
    icp: ""
    license: <a rel="license external nofollow noopener noreffer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>
  section:
    paginate: 20
    dateFormat: 01-02
    rss: 10
  list:
    paginate: 20
    dateFormat: 01-02
    rss: 10
  app:
    title: My CMS
    noFavicon: false
    svgFavicon: ""
    themeColor: '#ffffff'
    iconColor: '#5bbad5'
    tileColor: '#da532c'
  search:
    enable: true
    type: lunr
    contentLength: 4000
    placeholder: ""
    maxResultLength: 10
    snippetLength: 30
    highlightTag: em
    absoluteURL: false
    algolia:
      index: ""
      appID: ""
      searchKey: ""
  home:
    rss: 10
    profile:
      enable: true
      gravatarEmail: ""
      avatarURL: "https://raw.githubusercontent.com/googlefonts/noto-emoji/refs/heads/main/svg/emoji_u1f989.svg"
      title: "📜Blog | 📒 Notes | 🧰Tools | 🪐 Space"
      subtitle: "____👋 Hi! ____"
      typeit: true
      social: true
      disclaimer: ""
    posts:
      enable: true
      paginate: 6
      defaultHiddenFromHomePage: false
  social:
    GitHub: rltyty
    Email: except10n.rlt@gmail.com
    RSS: true
  page:
    hiddenFromHomePage: false
    hiddenFromSearch: false
    twemoji: false
    lightgallery: false
    ruby: true
    fraction: true
    fontawesome: true
    linkToMarkdown: true
    rssFullText: false
    toc:
      enable: true
      keepStatic: false
      auto: true
    math:
      enable: true
      inlineLeftDelimiter: "$"
      inlineRightDelimiter: "$"
      blockLeftDelimiter: "$$"
      blockRightDelimiter: "$$"
      copyTex: true
      mhchem: true
    code:
      copy: true
      maxShownLines: 50
    mapbox:
      accessToken: ""
      lightStyle: mapbox://styles/mapbox/light-v10?optimize=true
      darkStyle: mapbox://styles/mapbox/dark-v10?optimize=true
      navigation: true
      geolocate: true
      scale: true
      fullscreen: true
    share:
      enable: true
      X: false
      Twitter: false
      Threads: true
      Facebook: true
      Linkedin: false
      Whatsapp: false
      Pinterest: false
      Tumblr: false
      HackerNews: true
      Reddit: false
      VK: false
      Buffer: false
      Xing: false
      Line: true
      Instapaper: false
      Pocket: false
      Flipboard: false
      Weibo: true
      Blogger: false
      Baidu: false
      Odnoklassniki: false
      Evernote: false
      Skype: false
      Trello: false
      Diaspora: true
      Mix: false
      Telegram: true
    comment:
      enable: false
      disqus:
        enable: false
        shortname: ""
      gitalk:
        enable: false
        owner: ""
        repo: ""
        clientId: ""
        clientSecret: ""
      valine:
        enable: false
        appId: ""
        appKey: ""
        placeholder: ""
        avatar: mp
        meta: ""
        pageSize: 10
        lang: ""
        visitor: true
        recordIP: true
        highlight: true
        enableQQ: false
        serverURLs: ""
        emoji: ""
      facebook:
        enable: false
        width: 100%
        numPosts: 10
        appId: ""
        languageCode: ""
      telegram:
        enable: false
        siteID: ""
        limit: 5
        height: ""
        color: ""
        colorful: true
        dislikes: false
        outlined: false
      commento:
        enable: false
      utterances:
        enable: false
        repo: ""
        issueTerm: pathname
        label: ""
        lightTheme: github-light
        darkTheme: github-dark
      giscus:
        enable: false
        repo: ""
        repoId: ""
        category: Announcements
        categoryId: ""
        lang: ""
        mapping: pathname
        reactionsEnabled: "1"
        emitMetadata: "0"
        inputPosition: bottom
        lazyLoading: false
        lightTheme: light
        darkTheme: dark
    library:
      css: {}
      js: {}
    seo:
      images: []
      publisher:
        name: ""
        logoUrl: ""
  typeit:
    speed: 100
    cursorSpeed: 1000
    cursorChar: '|'
    duration: -1
  verification:
    google: ""
    bing: ""
    yandex: ""
    pinterest: ""
    baidu: ""
  seo:
    image: ""
    thumbnailUrl: ""
  analytics:
    enable: true
    google:
      id: ""
      anonymizeIP: true
      respectDoNotTrack: false
    fathom:
      id: ""
      server: ""
    plausible:
      dataDomain: ""
    yandexMetrica:
      id: ""
  cookieconsent:
    enable: true
    content:
      message: ""
      dismiss: ""
      link: ""
  cdn:
    data: ""
  compatibility:
    polyfill: false
    objectFit: false
markup:
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    lineNumbersInTable: true
    noClasses: false
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - \(
            - \)
          - - $
            - $
        enable: true
      definitionList: true
      footnote: true
      linkify: true
      strikethrough: true
      table: true
      taskList: true
      typographer: true
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
sitemap:
  changefreq: weekly
  filename: sitemap.xml
  priority: 0.5
Permalinks:
  posts: :filename
privacy:
  googleAnalytics: {}
  twitter: {}
  youtube: {}
mediaTypes:
  text/plain:
    suffixes:
      - md
outputFormats:
  MarkDown:
    mediaType: text/plain
    isPlainText: true
    isHTML: false
outputs:
  home:
    - HTML
    - RSS
    - JSON
  page:
    - HTML
    - MarkDown
  section:
    - HTML
    - RSS
  taxonomy:
    - HTML
    - RSS
