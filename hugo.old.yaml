baseURL: "https://korhal.h4ck.me"
languageCode: "en-us"
languageName: "English"
title: "rblog"
copyright: "© [rblog contributors](https://github.com/rltyty/rblog/graphs/contributors)"
theme:
  - LoveIt

enableGitInfo: true
enableEmoji: true
enableRobotsTXT: true
mainsections: ["apue", "conda", "java"]

pagination:
  disableAliases: false
  pagerSize: 10
  path: "page"

menu:
  main:
    - name: "Archive"
      url: "/archives/"
      weight: 5
    - name: "Search"
      url: "/search/"
      weight: 10
    - name: "Tags"
      url: "/tags/"
      weight: 10
    - name: "WiKi"
      url: "https://github.com/rltyty/rblog/wiki"
    - name: "Rhub"
      url: "/rhub/"

markup:
  highlight:
    noClasses: false
  goldmark:
    # renderer:
      # unsafe: true   # Critical for math support
    extensions:
      passthrough:
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - \(
            - \)
          - - $
            - $
        enable: true

module:
  hugoVersion:
    min: 0.147.7
