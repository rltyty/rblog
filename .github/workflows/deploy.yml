name: Deploy rblog (Hugo site)

on:
  push:
    branches: [ dev ] # or "master" or your deploy branch
  workflow_dispatch:  # manually trigger this workflow

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo (with submodules)
      uses: actions/checkout@v6
      with:
        submodules: recursive  # ⬅️ this ensures theme submodule is also checked out

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Install markmap-cli
      run: npm install -g markmap-cli

    - name: Generate and copy mindmaps to static/mindmaps
      run: |
        hooks/mindmap-auto-update-deploy.sh

    - name: Append mindmap links (safely)
      run: |
        find content/notes -name '*.html' | while read html; do
          md="${html%.html}.md"
          if [ -f "$md" ]; then
            rel="${html#content/notes/}"    # remove leading path
            rel="${rel%/index.html}"        # remove trailing /index.html if present
            link="[🧠 View Mindmap](/mindmaps/$rel)"
            grep -qxF "$link" "$md" || echo -e "\n$link" >> "$md"
          fi
        done

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: 0.145
        extended: true

    - name: Build Hugo site
      run: hugo --minify

    - name: Deploy via rsync
      uses: burnett01/rsync-deployments@v8
      with:
        switches: -avz --delete
        path: public/
        remote_path: ${{ secrets.DEPLOY_PATH }}
        remote_host: ${{ secrets.DEPLOY_HOST }}
        remote_user: ${{ secrets.DEPLOY_USER }}
        remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

