name: Deploy rblog (Hugo site)

on:
  push:
    branches: [ dev ]  # or "master" or your deploy branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive  # ⬅️ this ensures theme submodule is also checked out

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: 'latest'

    - name: Copy mindmaps to static/mindmaps
      run: |
        mkdir -p static/mindmaps
        find content/notes -name '*.html' -exec bash -c '
          for path; do
            rel="${path#content/notes/}"
            dest="static/mindmaps/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$path" "$dest"
          done
        ' bash {} +

    - name: Build Hugo site
      run: hugo --minify

    - name: Deploy via rsync
      uses: burnett01/rsync-deployments@7.0.2
      with:
        switches: -avz --delete
        path: public/
        remote_path: ${{ secrets.DEPLOY_PATH }}
        remote_host: ${{ secrets.DEPLOY_HOST }}
        remote_user: ${{ secrets.DEPLOY_USER }}
        remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

