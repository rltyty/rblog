name: Deploy rblog (Hugo site)

on:
  push:
    branches: [ dev ]  # or "master" or your deploy branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive  # ⬅️ this ensures theme submodule is also checked out

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: 'latest'
        extended: true

    - name: Copy mindmaps to static/mindmaps
      run: |
        # Process each HTML file individually
        find content/notes -name '*.html' -print0 | while IFS= read -r -d '' html_path; do
          dir="$(dirname "$html_path")"
          rel_dir="${dir#content/notes/}"

          # Create target directory
          mkdir -p "static/mindmaps/$rel_dir"

          # 1. Copy the HTML file
          cp "$html_path" "static/mindmaps/$rel_dir/"

          # 2. Copy PDFs from the same directory
          find "$dir" -maxdepth 1 -type f -name '*.pdf' -exec cp {} "static/mindmaps/$rel_dir/" \;

          # 3. Copy images/ subdirectory if it exists
          if [ -d "$dir/images" ]; then
            mkdir -p "static/mindmaps/$rel_dir/images"
            cp -r "$dir/images/." "static/mindmaps/$rel_dir/images/"
          fi
        done

    - name: Append mindmap links (safely)
      run: |
        find content/notes -name '*.html' | while read html; do
          md="${html%.html}.md"
          if [ -f "$md" ]; then
            rel="${html#content/notes/}"
            link="[🧠 View Mindmap](/mindmaps/$rel)"
            grep -qxF "$link" "$md" || echo -e "\n$link" >> "$md"
          fi
        done

    - name: Build Hugo site
      run: hugo --minify

    - name: Deploy via rsync
      uses: burnett01/rsync-deployments@7.0.2
      with:
        switches: -avz --delete
        path: public/
        remote_path: ${{ secrets.DEPLOY_PATH }}
        remote_host: ${{ secrets.DEPLOY_HOST }}
        remote_user: ${{ secrets.DEPLOY_USER }}
        remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

