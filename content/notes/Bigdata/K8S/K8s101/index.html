ion within the same namespace and across cluster<br>\nnamespaces","children":[{"content":"via kube-proxy: exposing services to external world over a virtual IP<br>\naddress and a dedicated port","children":[],"payload":{"tag":"li","lines":"290,292"}}],"payload":{"tag":"li","lines":"288,292"}},{"content":"External-to-Service communication for clients to access applications in a<br>\ncluster","children":[],"payload":{"tag":"li","lines":"292,295"}}],"payload":{"tag":"h3","lines":"276,277"}},{"content":"Fault-tolerance","children":[{"content":"\n<p data-lines=\"297,298\"><a href=\"https://raft.github.io/\">The Raft Consensus Algorithm</a></p>","children":[{"content":"An algorithm to address &quot;Consensus&quot; problem, multiple servers agree on<br>\nvalues, which is a fundamental problem in fault-tolerant distributed system.","children":[],"payload":{"tag":"li","lines":"298,301"}}],"payload":{"tag":"li","lines":"297,301"}},{"content":"\n<p data-lines=\"301,302\"><a href=\"https://thesecretlivesofdata.com/raft/\">Raft Visualization Explanation</a></p>","children":[{"content":"\n<p data-lines=\"303,304\">Node type: Leader, Candidate, Follower</p>","children":[],"payload":{"tag":"li","lines":"303,304"}},{"content":"\n<p data-lines=\"304,305\">Leader Election, majority nodes agree</p>","children":[{"content":"two timeout settings","children":[{"content":"election timeout: a follower waits until becoming a candidate","children":[{"content":"randomized to be 150ms~300ms","children":[],"payload":{"tag":"li","lines":"307,308"}},{"content":"after the timeout a follower becomes a candidate and starts a new<br>\nelection term, votes for itself, sends out Request vote messages to<br>\nother nodes","children":[],"payload":{"tag":"li","lines":"308,311"}},{"content":"if a receiving node hasn&apos;t voted in this term, vote for the candidate<br>\nand resets its election timeout","children":[],"payload":{"tag":"li","lines":"311,313"}},{"content":"once the candidate has a majority of v e","children":[],"payload":{"tag":"li","lines":"338,339"}},{"content":"the leader respond to the client the state change","children":[],"payload":{"tag":"li","lines":"339,341"}}],"payload":{"tag":"li","lines":"331,341"}},{"content":"\n<p data-lines=\"341,342\">Network partition, multiple leaders in different terms</p>","children":[{"content":"when network issue is fixed and the partition disappears, the minority<br>\nleader steps down and all its uncommitted log entries are cleared","children":[],"payload":{"tag":"li","lines":"342,346"}}],"payload":{"tag":"li","lines":"341,346"}}],"payload":{"tag":"li","lines":"301,346"}}],"payload":{"tag":"h3","lines":"295,296"}}],"payload":{"tag":"h2","lines":"231,232"}},{"content":"Kubernetes Configuration","children":[{"content":"Installation Types","children":[{"content":"all-in-one single-node (learning, development and testing)","children":[],"payload":{"tag":"li","lines":"357,358"}},{"content":"single control plane node and multiple worker node","children":[],"payload":{"tag":"li","lines":"358,359"}},{"content":"single control plane node with single etcd node (external) and multi-worker","children":[],"payload":{"tag":"li","lines":"359,360"}},{"content":"multiple control plane node (HA mode, with stacked etcd) and multiple worker node","children":[],"payload":{"tag":"li","lines":"360,361"}},{"content":"multiple control plane node, multiple etcd (external) and multiple worker","children":[],"payload":{"tag":"li","lines":"361,363"}}],"payload":{"tag":"h3","lines":"355,356"}},{"content":"Infrastructure","children":[{"content":"IaaS choice: bare mental, public cloud, private or hybrid cloud","children":[],"payload":{"tag":"li","lines":"365,366"}},{"content":"OS choice: Linux (Red Hat-based, Debian-based, or Windows)","children":[],"payload":{"tag":"li","lines":"366,367"}},{"content":"CNI solution choice","children":[],"payload":{"tag":"li","lines":"367,369"}}],"payload":{"tag":"h3","lines":"363,364"}},{"content":"Local Learning
