baseURL: https://korhal.h4ck.me
languageCode: en-us
title: rblog
copyright: "© [rblog contributors](https://github.com/rltyty/rblog/graphs/contributors)"
theme: [PaperMod]

markup:
  defaultMarkdownHandler: "pandoc"
  # goldmark:
  #   renderer:
  #     unsafe: true   # Critical for math support
  # pandoc:
  #   args: 
      # - "--no-highlight"
      # - "--highlight-style=pygments"

  highlight:
    noClasses: true
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai

security:
  enableInlineShortcodes: false  # Keep this as-is unless needed
  exec:
    allow: ["^pandoc$"]  # Whitelist pandoc (and mmark if used)
